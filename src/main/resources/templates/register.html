<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        form {
            max-width: 350px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f9f9f9;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .error-message {
            font-size: 13px;
            color: #d9534f; /* أحمر أنيق */
            margin-top: 4px;
        }
        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        a {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<h2>Register</h2>

<form th:action="@{/register-form}" th:object="${userRegister}" method="post">
    <label>Name:</label>
    <input type="text" th:field="*{name}" />
    <br/>

    <label>Email:</label>
    <input type="email" th:field="*{email}" />
    <!-- رسالة الخطأ -->
    <div th:if="${error}" class="error-message">
        <p th:text="${error}"></p>
    </div>
    <br/>

    <label>Password:</label>
    <input type="password" th:field="*{password}" />
    <br/>

    <button type="submit">Register</button>
</form>

<a th:href="@{/login}">Login</a>
</body>
</html>
